<div class="wrapper">
  <h1>Your checkin data</h1>
  <form class="form" novalidate>
    <div class="accordion">
      <!-- Personal Information Section -->
      <button
        type="button"
        class="accordion__header"
        (click)="onAccordionHeaderClick($event)"
        [attr.aria-expanded]="!personalInfoCollapsed"
        aria-controls="personal-info-content"
        id="personal-info-header"
      >
        <span class="accordion__title">Personal information</span>
        <svg
          class="accordion__arrow"
          [class.accordion__arrow--rotated]="!personalInfoCollapsed"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <path d="M7 10l5 5 5-5z" fill="currentColor" />
        </svg>
      </button>
      <div
        class="accordion__content"
        [class.hidden]="personalInfoCollapsed"
        id="personal-info-content"
        role="region"
        aria-labelledby="personal-info-header"
      >
        <div class="form__elements">
          <div class="input-group">
            <label for="firstName" class="sr-only">First Name</label>
            <input
              id="firstName"
              placeholder="First Name"
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
          <div class="input-group">
            <label for="lastName" class="sr-only">Last Name</label>
            <input
              id="lastName"
              placeholder="Last Name"
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
        </div>
        <div class="form__elements">
          <div class="input-group">
            <label for="email" class="sr-only">E-mail</label>
            <input
              id="email"
              placeholder="E-mail"
              class="input"
              type="email"
              required
              aria-required="true"
            />
          </div>
          <div class="input-group">
            <label for="phone" class="sr-only">Phone number</label>
            <input
              id="phone"
              placeholder="Phone number"
              class="input"
              type="tel"
              required
              aria-required="true"
            />
          </div>
        </div>
      </div>

      <!-- Address Section -->
      <button
        type="button"
        class="accordion__header"
        (click)="onAccordionHeaderClick($event)"
        [attr.aria-expanded]="!addressCollapsed"
        aria-controls="address-content"
        id="address-header"
      >
        <span class="accordion__title">Address</span>
        <svg
          class="accordion__arrow"
          [class.accordion__arrow--rotated]="!addressCollapsed"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <path d="M7 10l5 5 5-5z" fill="currentColor" />
        </svg>
      </button>
      <div
        class="accordion__content"
        [class.hidden]="addressCollapsed"
        id="address-content"
        role="region"
        aria-labelledby="address-header"
      >
        <div class="form__elements">
          <div class="input-group">
            <label for="street" class="sr-only">Street</label>
            <input
              id="street"
              placeholder="Street"
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
          <div class="input-group">
            <label for="houseNumber" class="sr-only">House Number</label>
            <input
              id="houseNumber"
              placeholder="House Nr."
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
        </div>
        <div class="form__elements">
          <div class="input-group">
            <label for="city" class="sr-only">City</label>
            <input
              id="city"
              placeholder="City"
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
          <div class="input-group">
            <label for="zipCode" class="sr-only">Zip Code</label>
            <input
              id="zipCode"
              placeholder="Zip Code"
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
          <div class="input-group">
            <label for="country" class="sr-only">Country</label>
            <input
              id="country"
              placeholder="Country"
              class="input"
              type="text"
              required
              aria-required="true"
            />
          </div>
        </div>
      </div>

      <!-- Payment Details Section -->
      <button
        type="button"
        class="accordion__header"
        (click)="onAccordionHeaderClick($event)"
        [attr.aria-expanded]="!paymentCollapsed"
        aria-controls="payment-content"
        id="payment-header"
      >
        <span class="accordion__title">Payment details</span>
        <svg
          class="accordion__arrow"
          [class.accordion__arrow--rotated]="!paymentCollapsed"
          viewBox="0 0 24 24"
          width="20"
          height="20"
          aria-hidden="true"
        >
          <path d="M7 10l5 5 5-5z" fill="currentColor" />
        </svg>
      </button>
      <div
        class="accordion__content"
        [class.hidden]="paymentCollapsed"
        id="payment-content"
        role="region"
        aria-labelledby="payment-header"
      >
        <div class="form__elements">
          <div class="input-group">
            <label for="cardNumber" class="sr-only">Credit Card Number</label>
            <input
              id="cardNumber"
              placeholder="Credit Card Number"
              class="input"
              type="text"
              required
              aria-required="true"
              autocomplete="cc-number"
            />
          </div>
          <div class="input-group">
            <label for="expiryDate" class="sr-only">Expiry Date</label>
            <input
              id="expiryDate"
              placeholder="Expiry Date"
              class="input"
              type="text"
              required
              aria-required="true"
              autocomplete="cc-exp"
            />
          </div>
        </div>
        <div class="form__elements">
          <div class="input-group">
            <label for="ccv" class="sr-only">CCV</label>
            <input
              id="ccv"
              placeholder="CCV"
              class="input"
              type="text"
              required
              aria-required="true"
              autocomplete="cc-csc"
            />
          </div>
          <div class="input-group">
            <label for="cardHolder" class="sr-only">Card Holder Name</label>
            <input
              id="cardHolder"
              placeholder="Card Holder Name"
              class="input"
              type="text"
              required
              aria-required="true"
              autocomplete="cc-name"
            />
          </div>
        </div>
      </div>
    </div>

    <p class="form__payment">
      Enter your card details: its number, expiry date and, 3-digit number on
      the back of the card and the holder name.
    </p>
    <div class="form__submit">
      <button type="submit" class="btn btn--primary">Save</button>
    </div>
  </form>
</div>
